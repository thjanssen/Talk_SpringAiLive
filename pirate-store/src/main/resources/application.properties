spring.application.name=pirate-store-fallback-start

# Local, file-based H2 database under ./data so the catalog survives restarts.
spring.datasource.url=jdbc:h2:file:./data/pirate-store;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

vaadin.launch-browser=true

logging.level.com.thorben.janssen.piratestore=INFO
logging.level.org.springframework.ai.chat.client.advisor=DEBUG


spring.ai.openai.api-key=${MyVerySecretChatGptKey}

# The file-based H2 database does not count as embedded, so Spring AI does not create
# the session memory tables on its own. Only takes effect once the session starter is added.
spring.ai.session.repository.jdbc.initialize-schema=always
