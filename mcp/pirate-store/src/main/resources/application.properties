spring.application.name=pirate-store

# Local, file-based H2 database under ./data so the catalog survives restarts.
spring.datasource.url=jdbc:h2:file:./data/pirate-store;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

vaadin.launch-browser=true

logging.level.com.thorben.janssen.piratestore=INFO

# MCP server exposing ProductTools/CartAssistantTools to the pirate-store-ai
# application. STATELESS: every tool call is a standalone HTTP request, with no
# server-side MCP session to maintain.
spring.ai.mcp.server.name=pirate-store-mcp
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Base URL of the pirate-store-ai application that SupportAssisstantService calls.
pirate-store.ai-service.base-url=http://localhost:8081