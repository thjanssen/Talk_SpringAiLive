spring.application.name=pirate-store-ai
server.port=8081

spring.ai.openai.api-key=${MyVerySecretChatGptKey}

# MCP client connecting to the pirate-store application's MCP server (see its
# support.tools.McpToolsConfig). "toolcallback.enabled" makes the client's
# tools available as a ToolCallbackProvider bean for SupportChatService.
spring.ai.mcp.client.streamable-http.connections.pirate-store.url=http://localhost:8080
spring.ai.mcp.client.streamable-http.connections.pirate-store.endpoint=/mcp
spring.ai.mcp.client.toolcallback.enabled=true

logging.level.com.thorben.janssen.piratestoreai=INFO
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
